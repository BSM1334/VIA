version: '3.8'
services:
db:
  image: postgres:15
  restart: unless-stopped
  environment:
    POSTGRES_USER: via_admin
    POSTGRES_PASSWORD: via_pass
    POSTGRES_DB: via_db
  volumes:
    - db_data:/var/lib/postgresql/data
    - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  ports:
    - "5432:5432"


backend:
  build: ./backend
  depends_on:
    - db
    - ai-service
  environment:
    - DATABASE_URL=postgres://via_admin:via_pass@db:5432/via_db
    - JWT_SECRET=verysecret
    - AI_SERVICE_URL=http://ai-service:5000
    - UPLOAD_DIR=/usr/src/app/uploads
  volumes:
    - ./backend/src/uploads:/usr/src/app/uploads
  ports:
    - "4000:4000"


frontend:
  build: ./frontend
  ports:
    - "3000:3000"
  environment:
    - VITE_API_URL=http://localhost:4000


ai-service:
  build: ./ai-service
  ports:
    - "5000:5000"


volumes:
  db_data: